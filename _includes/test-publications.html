<ol>
  {% for post in site.publications reversed %}
    {% if post.title and post.authors and post.venue %}
      <li>
        <strong>{{ post.title }}</strong><br>
        {{ post.authors }} — 
        <a href="{{ post.paperurl }}" target="_blank">{{ post.venue }}</a>
      </li>
    {% endif %}
  {% endfor %}
</ol>
