{% include base_path %}

<ol>
{% for post in site.publications reversed %}
  <li>
    <strong>{{ post.title }}</strong><br>
    {{ post.authors }} —
    {% if post.venue and post.link %}
      <a href="{{ post.link }}" target="_blank">{{ post.venue }}</a>
    {% elsif post.venue %}
      {{ post.venue }}
    {% endif %}
  </li>
{% endfor %}
</ol>
